name: precompile

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  precompile:
    runs-on: ubuntu-22.04
    env:
      PARAKEET_COMMIT: 5c9b0fbbd8e611d88e47d7e1ebae9bca9b447e8f
      PARAKEET_DIR: ${{ github.workspace }}/parakeet.cpp
      PARAKEET_LIB_DIR: ${{ github.workspace }}/parakeet.cpp/build-shared
      ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/cache
    steps:
      - name: Checkout parakeet-diar
        uses: actions/checkout@v4

      - name: Checkout parakeet.cpp
        uses: actions/checkout@v4
        with:
          repository: mudler/parakeet.cpp
          ref: 5c9b0fbbd8e611d88e47d7e1ebae9bca9b447e8f
          submodules: recursive
          path: parakeet.cpp

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y patchelf cmake build-essential

      # Same flags as realtime-diarization/scripts/build-libparakeet.sh cpu, plus
      # GGML_NATIVE=OFF so the bundled CPU code runs on any x86_64 machine.
      - name: Build libparakeet (CPU, portable)
        run: |
          cmake -S parakeet.cpp -B parakeet.cpp/build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DPARAKEET_SHARED=ON \
            -DPARAKEET_WITH_CED=OFF \
            -DPARAKEET_BUILD_SERVER=OFF \
            -DPARAKEET_BUILD_CLI=OFF \
            -DPARAKEET_BUILD_TESTS=OFF \
            -DGGML_NATIVE=OFF
          cmake --build parakeet.cpp/build-shared -j "$(nproc)" --target parakeet
          test -f parakeet.cpp/build-shared/libparakeet.so

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1"
          elixir-version: "1.18.4"

      - name: Fetch dependencies
        run: mix deps.get

      - name: Build precompiled NIF archive
        env:
          MIX_ENV: prod
        run: mix elixir_make.precompile

      - name: Upload archives to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cache/*.tar.gz
            cache/*.sha256
